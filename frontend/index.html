<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>sports-trader-cpp — 单屏盯盘终端 v3</title>
  <link rel="stylesheet" href="src/style.css" />
</head>
<body>
<div id="app">

  <!-- DEMO 横幅 (data_source==demo 时强制显示, 不可关闭, 老钱红线 P0) -->
  <div id="demo-banner" class="hidden">
    演示数据 · 非实盘 — 所有量化参数仅供参考, 不触发下单
  </div>

  <!-- 顶部常驻条 -->
  <div class="top-bar">
    <span id="top-mode-badge"></span>
    <span id="top-state"></span>
    <span id="top-uptime" class="top-dim"></span>
    <span class="top-sep">|</span>
    <span class="top-label">WSS</span>
    <span id="top-wss"></span>
    <span class="top-sep">|</span>
    <span class="top-label">净PnL</span>
    <span id="top-pnl" class="top-pnl">—</span>
    <span class="top-sep">|</span>
    <span id="top-gate"></span>
    <span class="top-sep">|</span>
    <span class="top-label">p99</span>
    <span id="top-p99" class="top-dim">—</span>
    <span class="top-sep">|</span>
    <span class="top-label">staleness</span>
    <span id="top-staleness" class="top-dim">—</span>
    <span class="top-sep">|</span>
    <span class="top-label">拒单/60s</span>
    <span id="top-rejects" class="top-dim">—</span>
    <div class="top-right">
      <button class="icon-btn" id="settings-btn" title="API 配置">&#9881;</button>
    </div>
  </div>

  <!-- 设置面板 -->
  <div id="settings-panel" class="hidden">
    <div class="settings-row">
      <label>API Base</label>
      <input id="api-base-input" type="text" placeholder="http://127.0.0.1:8092" />
      <button class="btn-primary" id="api-base-save">保存并刷新</button>
    </div>
    <div class="settings-hint">默认 127.0.0.1:8080. 加 ?stub=1 使用 mock 数据.</div>
  </div>

  <!-- Stub 标识 -->
  <div id="stub-banner" class="hidden">
    STUB 模式 — 本地 mock 数据 (URL 含 ?stub=1). 移除参数后连接真实 API.
  </div>

  <!-- 全局 PnL 曲线 (窄条 sparkline) -->
  <div id="pnl-sparkline-wrap">
    <div id="pnl-sparkline"><div class="no-data spark-placeholder">PnL 曲线加载中...</div></div>
  </div>

  <!-- 主盯盘区: market 卡片网格 -->
  <div id="market-grid">
    <div class="no-data grid-placeholder">加载市场数据...</div>
  </div>

  <!-- 底部折叠区: 仅次要内容 -->
  <details id="secondary-details" class="secondary-section">
    <summary class="secondary-summary">次要信息 (PnL 归因瀑布 / raw metrics)</summary>

    <div class="secondary-inner">

      <!-- PnL 归因瀑布 -->
      <div class="panel-card">
        <div class="panel-title">PnL 归因 (瀑布) <span class="poll-hint">15s</span></div>
        <div id="pnl-attr-panel"><div class="no-data">加载中...</div></div>
      </div>

      <!-- Raw metrics -->
      <div class="panel-card">
        <div class="panel-title">Prometheus /metrics <span class="poll-hint">30s</span></div>
        <div id="metrics-panel"><div class="no-data">加载中...</div></div>
      </div>

    </div>
  </details>

</div><!-- /#app -->

<script type="module" src="src/app.js"></script>
</body>
</html>
