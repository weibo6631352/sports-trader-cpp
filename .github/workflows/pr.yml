name: PR Checks
# 老高 v1.7 (W9 Wave 60) — v1.5 + 3 新 Python grep job + abi_lock v1.7 struct + ADR-027
# 红线: PR <= 8 min, 命中即 reject
# 改本文件: 老高 + 老郭 + 老雷 三方任一签字, PR 描述带 "spec by 老郭" 走 ADR-005 派单
#
# v1.7 新增 job (Wave 60, ADR-027 Enforce-3 上线):
#   ci-grep-core-data-structure-ssot  — ADR-027 C1-C4 SSOT cite + token_id + Side enum + handshake
#   ci-grep-worktree-commit-check     — ADR-024 §3.1 isolation=worktree 必伴 pwd verify (防 GM 错 #19)
#   ci-grep-gm-merge-audit            — ADR-024 §6 GM merge commit message 格式 WARN (老郭 spec)
#   ci-grep-abi-lock 升 v1.7          — 加 OrderIntent/Position/Side/Outcome/SignV52Request/PositionKey
#
# v1.5 (W8 Wave 35) 2 新 job 保留:
#   ci-grep-ic-no-self-test   — IC 漏写测试 WARN W8-W9, FAIL W10
#   ci-grep-worktree-check    — ADR-021 worktree 隔离 FAIL W8 起
# v1.4 (W7 Wave 33) 5 新 job 保留:
#   ci-grep-gm-commit-author / ci-grep-binary-large-file / ci-grep-fom
#   ci-grep-abi-cascade / ci-grep-adr010-wno
# v1.2 (W6 Wave 28) 5 新 job 保留:
#   ci-grep-r20-pit-chain / ci-grep-r12-wss-blocking / ci-grep-r33-5host-paper
#   ci-grep-hmac-4bug / ci-grep-adr009-model-tier
# 总 grep job: 17 → 20

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  pr-meta-grep:
    name: PR meta grep (ADR-005 spec by 主管 + persona 边界)
    runs-on: ubuntu-latest
    timeout-minutes: 1
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: ADR-005 "spec by 主管" 标记 (5 战斗单元 IC task 必经主管)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -e
          # ADR-005: PR 描述必带 "spec by <主管/协调人/GM>" 一行
          # 5 主管 = 老周 / 老韩 / 小梁 / 小余 / 老胡
          # F 协调人 = 老郭
          # GM = 老雷; CPO = 老钱
          # 例外: dependabot / 顾问团 self-spec (老高 / 老何 / 老郭 / 老徐 / 小白 / 老钱) 走 "self-spec (F 顾问)"
          body="$PR_BODY"
          if echo "$body" | grep -qiE 'spec by (老周|老韩|小梁|小余|老胡|老郭|老雷|老钱)'; then
            echo "OK: ADR-005 spec by 主管标记命中"
          elif echo "$body" | grep -qiE 'self-spec \(F 顾问\)|self-spec \(F advisor\)'; then
            echo "OK: F 顾问 self-spec 例外"
          else
            echo "::error::ADR-005: PR description 必须含一行 'spec by <主管>' (老周/老韩/小梁/小余/老胡/老郭/老雷/老钱) 或 'self-spec (F 顾问)'"
            exit 1
          fi
      - name: persona 边界 grep (不写代码 persona 必带 spec-only 声明)
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -e
          body="$PR_BODY"
          # 不写代码 persona (CLAUDE.md §10 拒接边界): 主管 + CPO + PM coord + 部分顾问
          # 小程 (#19 strategy researcher 仅出 spec) / 老钱 (#15 CPO) / 小杜 (#28 PM coordinator) / 小苏 (#29 UX content)
          # 若 PR 描述声称 spec by 这几位 → 必带 "spec only, 不写代码" 声明
          for p in '小程' '老钱' '小杜' '小苏'; do
            if echo "$body" | grep -qE "spec by $p"; then
              if ! echo "$body" | grep -qE "spec only.*不写代码|spec only.*no code|$p.*只出.*spec"; then
                echo "::error::persona 边界: spec by $p 必带 'spec only, 不写代码' 声明 (CLAUDE.md §10 拒绝任务)"
                exit 1
              fi
            fi
          done

  redline-grep:
    name: Redline grep (R-20 8 + HMAC 4 + R-11 + R-12 + R-33)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: R-20 PIT redline grep (8 项, v1.1)
        run: |
          set -e
          fail=0
          # 1. now() 不带 UTC/MONOTONIC 注释
          if git grep -nE 'std::chrono::system_clock::now\(\)' -- 'src/**/*.cpp' 'src/**/*.hpp' 'include/**/*.hpp' \
             | grep -v 'CLOCK_MONOTONIC\|UTC\|epoch_ns'; then
            echo "::error::R-20 §2.2: now() 必须带 UTC/CLOCK_MONOTONIC_RAW 注释"; fail=1
          fi
          # 2. localtime/mktime 禁
          if git grep -nE '\b(localtime|mktime)\b' -- 'src/**/*.cpp' 'src/**/*.hpp' 'include/**/*.hpp'; then
            echo "::error::R-20 §6: 禁 localtime/mktime, 统一 UTC int64 epoch_ns"; fail=1
          fi
          # 3. 时间字段 int 而非 int64
          if git grep -nE '\bint\s+\w*_(ts|time|timestamp)\b' -- 'src/**/*.cpp' 'src/**/*.hpp' 'include/**/*.hpp' \
             | grep -v int64; then
            echo "::error::R-20 §6: 时间字段必须 int64"; fail=1
          fi
          # 4/5/6: signal/IPC/audit struct 必须含 feature_snapshot_id + 4 ts
          for pat in 'struct\s+\w*(Signal|Intent)\b:feature_snapshot_id' \
                     'struct\s+\w*(Intent|RmRequest|RiskRequest)\b:event_ts data_source_ts ingestion_ts as_of_ts' \
                     'struct\s+\w*(AuditRecord|WalEntry|AuditEntry)\b:event_ts data_source_ts ingestion_ts as_of_ts'; do
            decl="${pat%:*}"; reqs="${pat#*:}"
            for f in $(git grep -lE "$decl" -- 'include/**/*.hpp' 'src/**/*.hpp' 2>/dev/null || true); do
              for req in $reqs; do
                grep -qE "${req}(_ns)?\b" "$f" || { echo "::error::R-20: $f $decl 缺 $req"; fail=1; }
              done
            done
          done
          # 7. (W5 v1.1 新增) UPSTREAM_PAYLOAD 优先: data_source_ts 严禁 = now() / clock_realtime / system_clock
          # 上游 ts 必须从 wire payload 抽, 本地 now() 替代上游 = R-20 §2.2 红线
          if git grep -nE 'data_source_ts\s*=\s*(std::chrono::|clock_|system_clock|monotonic_now|epoch_now\(\)|now\(\))' \
             -- 'src/**/*.cpp' 'src/**/*.hpp' 'include/**/*.hpp'; then
            echo "::error::R-20 §2.2 (v1.1 新): data_source_ts 严禁 = now() (UPSTREAM_PAYLOAD 优先, 上游 ts 不可本地伪造)"; fail=1
          fi
          # 8. (W5 v1.1 新增) event_ts == ingestion_ts 直接赋值反模式
          # 4 ts 不可混 — event_ts 是事件发生时(上游标), ingestion_ts 是本地落地时, 直接 = 等价于伪造 PIT
          if git grep -nE 'event_ts\s*=\s*ingestion_ts|ingestion_ts\s*=\s*event_ts' \
             -- 'src/**/*.cpp' 'src/**/*.hpp' 'include/**/*.hpp'; then
            echo "::error::R-20 §2.2 (v1.1 新): event_ts != ingestion_ts, 4 ts 不可混赋值"; fail=1
          fi
          exit $fail
      - name: 老李 HMAC 4 bug 反模式 (v3 §A R1-R4, 永久 enforce)
        run: |
          set -e; fail=0
          # bug 1: HMAC base string 严禁 querystring 拼 path
          if git grep -nE 'request_path\s*\+\s*"?\?"?\s*\+\s*query|base_string.*\?.*query' \
             -- 'src/exchange/polymarket/**/*.cpp' 'src/exchange/polymarket/**/*.hpp' \
                'src/stcpp/polymarket/**/*.cpp' 'src/stcpp/polymarket/**/*.hpp' \
                'include/stcpp/polymarket/**/*.hpp'; then
            echo "::error::HMAC bug 1: request_path 严禁 + querystring (v3 §A R1)"; fail=1
          fi
          # bug 2: balance-allowance 参数名严禁 param_type (应 asset_type)
          if git grep -nE '\bparam_type\b|\bparamType\b|\bparam-type\b' -- 'src/**/*.cpp' 'src/**/*.hpp' 'include/**/*.hpp'; then
            echo "::error::HMAC bug 2: 字段必须 asset_type (而非 param_type / paramType / param-type, v3 §A R2)"; fail=1
          fi
          # bug 3: sigType 严禁 = 2 (Polymarket proxy 形态), 必须 = 1 (Magic 1-of-1 Safe, 我们的形态)
          if git grep -nE '\bsigType\s*[:=]\s*2\b|\bsignatureType\s*[:=]\s*2\b|"sigType"\s*:\s*2' \
             -- 'src/**/*.cpp' 'src/**/*.hpp' 'include/**/*.hpp' '**/*.py'; then
            echo "::error::HMAC bug 3: sigType 必须 = 1 (Magic 1-of-1 Safe), 严禁 = 2 (proxy 形态, v3 §A R3)"; fail=1
          fi
          # bug 4: HMAC sig base64 padding 严禁 rstrip / replace 去 =
          if git grep -nE 'urlsafe_b64encode.*\.rstrip\(|b64encode.*\.replace\(\s*["\x27]=["\x27]' \
             -- '**/*.py' '**/*.cpp' '**/*.hpp'; then
            echo "::error::HMAC bug 4: base64 sig padding 必须保留 = (v3 §A R4)"; fail=1
          fi
          exit $fail
      - name: 老项目参考红线 (INCIDENTS #3)
        run: |
          # exclude: INCIDENTS / MEETINGS / SPRINTS / 本 workflow 文件本身
          # — 这几处合法保留历史引用 (复盘 / 会议纪要 / sprint 进展)
          # v1.1 新增 docs/SPRINTS + docs/MEETINGS + docs/RESEARCH/laogao-pr-review-* (本 doc) exclude
          if git grep -nE 'sports-tail-trader' \
             -- ':!docs/INCIDENTS/**' ':!docs/MEETINGS/**' ':!docs/SPRINTS/**' \
                ':!docs/RESEARCH/laogao-pr-review-*' \
                ':!.github/workflows/**'; then
            echo "::error::GM 红线: 不准参考老项目 sports-tail-trader"; exit 1
          fi
      - name: R-11 paper 严禁写真账本 (v1.1 升级)
        run: |
          set -e; fail=0
          # 旧: paper_* 字段不能与 position/pnl_ledger/nonce_ledger 同行
          if git grep -nE 'paper_\w*\s+(position|pnl_ledger|nonce_ledger)' \
             -- 'src/**/*.cpp' 'src/**/*.hpp' 'include/**/*.hpp'; then
            echo "::error::R-11: paper_* 严禁写真账本"; fail=1
          fi
          # v1.1 新: paper mode 路径严禁 write_to position.wal / pnl_ledger.wal / nonce_ledger.wal
          # 路径上 paper/ 目录 + write_to / fsync / fwrite / fopen.*"w" 命中真账本 WAL = R-11 P0
          if git grep -nE '(write_to|fopen|fwrite|fsync).*\b(position|pnl_ledger|nonce_ledger)\.wal\b' \
             -- 'src/stcpp/**/paper/**/*.cpp' 'src/stcpp/**/paper/**/*.hpp' \
                'src/**/paper_*.cpp' 'src/**/paper_*.hpp'; then
            echo "::error::R-11 (v1.1): paper mode 严禁 write position.wal / pnl_ledger.wal / nonce_ledger.wal"; fail=1
          fi
          # v1.1 新: paper_*.wal path 严禁 hardcode 进 risk_audit / position / nonce_ledger 真账本模块
          if git grep -nE '"paper_[a-z_]*\.wal"|paper_[a-z_]+\.wal' \
             -- 'src/stcpp/risk/**/*.cpp' 'src/stcpp/risk/**/*.hpp' \
                'src/stcpp/execution/nonce_*.cpp' 'src/stcpp/execution/nonce_*.hpp' \
                'include/stcpp/risk/**/*.hpp' 'include/stcpp/execution/nonce_*.hpp'; then
            echo "::error::R-11 (v1.1): paper_*.wal 严禁 hardcode 入 risk_audit/position/nonce_ledger 真账本模块"; fail=1
          fi
          exit $fail
      - name: R-12 WSS event loop 同步反模式 (v1.1 新)
        run: |
          set -e; fail=0
          # ADR R-12: WSS handler / event loop 严禁同步 std::lock / blocking read / sync HTTP / fsync (> 100us)
          # 扫 wss 路径下的 cpp/hpp, 命中即 P0
          # 注: spin_lock < 100us 允许, 但 std::lock_guard / unique_lock / mutex.lock() 默认禁
          if git grep -nE 'std::(lock_guard|unique_lock|scoped_lock|shared_lock)\s*<' \
             -- 'src/stcpp/polymarket/wss/**/*.cpp' 'src/**/wss/**/*.cpp' 'src/**/ws_handler*.cpp'; then
            echo "::error::R-12: WSS event loop 严禁 std::lock_guard / unique_lock (除 spin < 100us, 加注释 // SPIN_OK 豁免)"; fail=1
          fi
          if git grep -nE '\.(blocking_read|blocking_write|recv\(|read_until)\(' \
             -- 'src/stcpp/polymarket/wss/**/*.cpp' 'src/**/wss/**/*.cpp'; then
            echo "::error::R-12: WSS event loop 严禁 blocking_read / recv()"; fail=1
          fi
          if git grep -nE 'synchronous_http|http_client::(Get|Post|Put|Delete)|curl_easy_perform\(' \
             -- 'src/stcpp/polymarket/wss/**/*.cpp' 'src/**/wss/**/*.cpp'; then
            echo "::error::R-12: WSS event loop 严禁同步 HTTP (sync REST = 阻塞 IO)"; fail=1
          fi
          if git grep -nE '\bfsync\(|\bfdatasync\(' \
             -- 'src/stcpp/polymarket/wss/**/*.cpp' 'src/**/wss/**/*.cpp'; then
            echo "::error::R-12: WSS event loop 严禁 fsync (阻塞 IO)"; fail=1
          fi
          exit $fail
      - name: R-33 PM client 必须用第 5 host (sports-api)
        run: |
          set -e; fail=0
          # R-33 流程红线 (v1.1 新): PM market WSS 必须用 wss://sports-api.polymarket.com/ws
          # 严禁 paper mode 接 clob WSS (clob 是私有 user channel, paper 不下单不需要)
          # 严禁 hard-code 旧 host ws-subscriptions-clob 当 market channel
          if git grep -nE 'wss://ws-subscriptions-clob\.polymarket\.com/ws/market' \
             -- 'src/**/*.cpp' 'src/**/*.hpp' 'include/**/*.hpp' '**/*.yaml' '**/*.json' \
             ':!docs/**' ':!**/*_test.cpp'; then
            echo "::error::R-33: PM market WSS 严禁旧 host (ws-subscriptions-clob/ws/market), 必须用第 5 host wss://sports-api.polymarket.com/ws"; fail=1
          fi
          # paper mode 路径下严禁出现 /ws/user (私有 channel)
          if git grep -nE 'wss?://[^"]*/ws/user' \
             -- 'src/stcpp/**/paper/**/*.cpp' 'src/stcpp/**/paper/**/*.hpp' \
                'src/**/paper_*.cpp' 'src/**/paper_*.hpp'; then
            echo "::error::R-33 + R-11: paper mode 严禁 /ws/user (私有 HMAC channel, paper 不下单不接)"; fail=1
          fi
          exit $fail

  # ---------------------------------------------------------------------------
  # v1.2 新增: 5 Python grep job (Wave 28 真落 CI)
  # ---------------------------------------------------------------------------

  ci-grep-r20-pit-chain:
    name: R-20 PIT chain ts 反模式 (Python, v1.2)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Run r20_pit_chain.py
        run: python3 tests/ci_grep/r20_pit_chain.py

  ci-grep-r12-wss-blocking:
    name: R-12 WSS 阻塞反模式 (Python, v1.2)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Run r12_wss_blocking.py
        run: python3 tests/ci_grep/r12_wss_blocking.py

  ci-grep-r33-5host-paper:
    name: R-33 paper /ws/user + 旧 clob host (Python, v1.2)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Run r33_5host_paper.py
        run: python3 tests/ci_grep/r33_5host_paper.py

  ci-grep-hmac-4bug:
    name: HMAC 4 bug 反模式 (Python, v1.2)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Run hmac_4bug.py
        run: python3 tests/ci_grep/hmac_4bug.py

  ci-grep-adr009-model-tier:
    name: ADR-009 v2 model tier (Python, v1.2)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Run adr009_model_tier.py
        run: python3 tests/ci_grep/adr009_model_tier.py

  # ---------------------------------------------------------------------------
  # ABI lock enforce (abi_lock.py v1.4 — 老高 W7 Wave 33 always-pass 注释已清)
  # ---------------------------------------------------------------------------

  ci-grep-abi-lock:
    name: ABI lock (PM client + crypto ed25519, v1.5)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: ABI lock enforce (abi_lock.py v1.5 — ed25519/crypto)
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 tests/ci_grep/abi_lock.py

  # ---------------------------------------------------------------------------
  # v1.1 保留: risk-enum-coverage
  # ---------------------------------------------------------------------------

  risk-enum-coverage:
    name: RM 21 reject enum coverage (21/21 必过)
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Run risk_enum_coverage.py
        run: python3 tests/ci_grep/risk_enum_coverage.py

  cpp-format:
    name: clang-format
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: clang-format check
        run: |
          if find src include tests -type f \( -name '*.cpp' -o -name '*.hpp' \) 2>/dev/null | head -1; then
            clang-format --version
            find src include tests -type f \( -name '*.cpp' -o -name '*.hpp' \) -print0 \
              | xargs -0 clang-format --dry-run --Werror
          else
            echo "no C++ files yet (W3 骨架阶段), skip"
          fi

  build-paper:
    name: Build (paper + ASAN/UBSAN)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DSTCPP_EXEC_MODE=paper \
            -DSTCPP_ENABLE_ASAN=ON -DSTCPP_ENABLE_UBSAN=ON -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel 4
      - name: Test (CTest)
        run: |
          if [ -d build/tests ]; then
            ctest --test-dir build --output-on-failure
          else
            echo "no tests yet (W3), skip"
          fi

  build-release-ubsan:
    # BUG-W5-001 (老沈 W5 Wave 24): Release (-O2) + UBSAN 单跑 RM 单测,
    # 防 next_audit_id() 这类 UB 在 -O2 优化下回归 (debug 跑不出, release 才炸).
    name: Build (release -O2 + UBSAN, RM 单测专跑)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Configure (Release + UBSAN, halt_on_error)
        env:
          CXXFLAGS: "-O2 -fsanitize=undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer"
          LDFLAGS:  "-fsanitize=undefined"
        run: |
          cmake -S . -B build-rel-ubsan -DCMAKE_BUILD_TYPE=Release \
            -DSTCPP_EXEC_MODE=paper -DSTCPP_ENABLE_UBSAN=ON -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build-rel-ubsan --parallel 4
      - name: Test RM 单测 (UBSAN halt_on_error=1)
        env:
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1:abort_on_error=1"
        run: |
          if [ -d build-rel-ubsan/tests ]; then
            ctest --test-dir build-rel-ubsan -R 'RiskGateway|AuditId|RejectEnum|InvalidIntentSubReason' \
              --output-on-failure
          else
            echo "no tests yet, skip"
          fi

  # ---------------------------------------------------------------------------
  # v1.4 新增: 5 Python grep job (Wave 33 — GM 错 #13 #14 配套 + FOM + ABI cascade + ADR-010 wno)
  # ---------------------------------------------------------------------------

  ci-grep-gm-commit-author:
    name: GM commit author warning + audit (v1.4)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Run gm_commit_author_check.py
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 tests/ci_grep/gm_commit_author_check.py

  ci-grep-binary-large-file:
    name: binary 大文件 + ML artifact 入 git (v1.4, GM 错 #14)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Run binary_large_file_check.py
        run: python3 tests/ci_grep/binary_large_file_check.py

  ci-grep-fom:
    # 状态: warning-only 直到 ADR-005 §3.4 W7 W4 立后设 FOM_ACTIVE=1 激活 FAIL 模式
    name: FOM ref 检查 (ADR-005 §3.4, v1.4, W7 W4 激活)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Run fom_check.py
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          # FOM_ACTIVE: 设为 "1" 后升级为 FAIL 模式 (ADR-005 §3.4 W7 W4 激活)
          FOM_ACTIVE: "0"
        run: python3 tests/ci_grep/fom_check.py

  ci-grep-abi-cascade:
    name: ABI cascade 下游 audit 清单 (v1.4, 老王 W6 Wave 32)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Run abi_cascade_check.py
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 tests/ci_grep/abi_cascade_check.py

  ci-grep-adr010-wno:
    name: ADR-010 -Wno-* 合规检查 (v1.4, 与小宋 W7 协作)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Run adr010_wno_check.py
        run: python3 tests/ci_grep/adr010_wno_check.py

  # ---------------------------------------------------------------------------
  # v1.5 新增: 2 Python grep job (Wave 35 — GM 错 #21 补救 + ADR-021/023 配套)
  # ---------------------------------------------------------------------------

  ci-grep-ic-no-self-test:
    # ADR-023: IC 自测唯一裁判 — IC 改 src/include 但漏写对应 tests/ → WARN W8-W9, FAIL W10
    # W8-W9: warning-only (exit 0), W10 起升 FAIL (脚本内 exit 改 1 或此处加 --fail-on-warn)
    name: IC 漏写测试 WARN (ADR-023, v1.5, W8-W9 warning / W10 FAIL)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Run ic_no_self_test.py (W8-W9 warning-only)
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 tests/ci_grep/ic_no_self_test.py
        # W10 起: 改为 continue-on-error: false 并脚本内 exit 1

  ci-grep-worktree-check:
    # ADR-021: worktree 隔离 W8 起强约束 — 派单 md subagent_type= 必含 isolation="worktree"
    name: ADR-021 worktree 隔离 enforce (v1.5, FAIL W8 起)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Run worktree_check.py
        run: python3 tests/ci_grep/worktree_check.py

  # ---------------------------------------------------------------------------
  # v1.7 新增: 3 Python grep job (Wave 60 — ADR-027 Enforce-3 + ADR-024 §3.1/§6)
  # ---------------------------------------------------------------------------

  ci-grep-core-data-structure-ssot:
    # ADR-027 Enforce-3: 核心数据结构 SSOT cite C1-C4 检查
    # C1: PR description 含 polymarket_ssot + goalserve_ssot 引用
    # C2: OrderIntent/SignedOrder struct 含 token_id 字段
    # C3: Side enum 含 Buy + Sell
    # C4: PR 含 *-handshake-v*.md 引用
    name: ADR-027 核心数据结构 SSOT cite C1-C4 (v1.7, FAIL)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Run core_data_structure_ssot_check.py
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 tests/ci_grep/core_data_structure_ssot_check.py

  ci-grep-worktree-commit-check:
    # ADR-024 §3.1: isolation=worktree 派单必须配套 pwd verify (防 GM 错 #19)
    # Rule A (FAIL): isolation=worktree 缺 pwd verify
    # Rule B (WARN): 疑似 sub-agent 跨写 main
    name: ADR-024 worktree+pwd verify 强约束 (v1.7, Rule A FAIL)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Run worktree_commit_check.py
        run: python3 tests/ci_grep/worktree_commit_check.py

  ci-grep-gm-merge-audit:
    # ADR-024 §6 GM merge commit message 格式 WARN (老郭 spec)
    # GM 老雷 merge 时 commit message 建议含 "merge: <persona> <Wave NN>"
    # 当前 WARN-only (exit 0), 不阻断 PR
    name: ADR-024 GM merge commit message audit (v1.7, WARN-only)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Run gm_merge_audit.py
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 tests/ci_grep/gm_merge_audit.py
