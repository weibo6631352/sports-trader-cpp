| ctest add_test 计数 (ADR-032 本地优先, CI 估算) | ${CTEST_COUNT} |
| 本周 commit 数 | ${WAVE_COUNT} |
| 本周 merged PR 数 | ${PR_COUNT} |

> 精确 ctest 数字由老胡从本地 \`cmake --build build && ctest\` 输出补充。

