)"

      - name: 跳过重复 Issue 通知
        if: steps.dedup_check.outputs.EXISTING != '0'
        run: |
          echo "本周 Sprint-3 ${{ steps.sprint_info.outputs.WEEK_LABEL }} 周报 Issue 已存在, 跳过创建."
