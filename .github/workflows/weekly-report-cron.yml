## §2 Wave count

- 本周 Wave 范围 (估算): Wave ${WAVE_BASE} - ${WAVE_END}
- 实际 wave 数: ${WAVE_COUNT} (git commit 数, 含直推 main)
- PR merged 数: ${PR_COUNT}

