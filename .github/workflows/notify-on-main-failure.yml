name: Notify on main failure

# 老板 2026-05-29 verbatim "失败如何通知我们" 触发
# 通知策略 (ADR-033 候选):
#   - main 上 push 后 CI fail → auto-create GitHub Issue
#   - assign 老高 (CI owner) + label "ci-fail" + "p0"
#   - 老高 W10 W2 后续 extend Slack / 邮件 webhook (Task #125)

on:
  workflow_run:
    workflows: ["PR Checks", "PR Linux Checks (ADR-032 v2)", "Perf Regression"]
    types: [completed]
    branches: [main]

permissions:
  issues: write
  actions: read

jobs:
  alert-on-main-fail:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Auto-create GitHub Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO=${{ github.repository }}
          RUN_ID=${{ github.event.workflow_run.id }}
          RUN_NAME="${{ github.event.workflow_run.name }}"
          HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
          COMMIT_MSG=$(git log -1 --format='%s' "$HEAD_SHA" 2>/dev/null || echo "$HEAD_SHA")
          RUN_URL="https://github.com/$REPO/actions/runs/$RUN_ID"

          # 防重复: 看是否 24h 内同名 Issue 已开
          EXISTING=$(gh issue list --repo $REPO --label ci-fail --state open --search "$RUN_NAME in:title" --json number --jq 'length')
          if [ "$EXISTING" -gt 0 ]; then
            echo "Existing ci-fail issue for $RUN_NAME, skip"
            exit 0
          fi

          gh issue create --repo $REPO \
            --title "🚨 main CI fail: $RUN_NAME (commit ${HEAD_SHA:0:7})" \
            --body "## CI fail

**Workflow**: $RUN_NAME
**Commit**: $HEAD_SHA
**Message**: $COMMIT_MSG
**Run URL**: $RUN_URL

老板 5/29 verbatim '失败如何通知我们' enforce.
老高 (#16) 主 owner. 总裁 (P-00) 通知线索.

ADR-032 §3 策略 3 衍生: main CI fail 必须有人看, 不能 admin merge 后无 actionable." \
            --label "ci-fail,p0" \
            --assignee weibo6631352 || true
